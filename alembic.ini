# Configuración de Alembic (migraciones de la base de datos).
#
# La URL de la base NO está aquí a propósito: sale de DATABASE_URL en
# migrations/env.py, que es la misma variable que usa la aplicación y que
# además pasa por `_normalizar_url` (app/core/database.py). Escribirla en
# este archivo significaría tener la contraseña de producción versionada,
# y dos sitios distintos diciendo a qué base apuntar.

[alembic]
script_location = migrations

# Las migraciones se nombran con la fecha delante, para que el orden en el
# que se crearon se vea al listar la carpeta.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# Alembic corre en el arranque del servicio y su salida va a los logs de
# Render junto con la del bot. Se deja en INFO para que un despliegue que
# aplica una migración lo diga; en WARN, una migración que tarda parecería
# un arranque colgado.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
