# ═════════════════════════════════════════════════════════════════════
#  EL NEGOCIO
#  Este es el archivo que se edita para adaptar el bot a otro cliente.
#  Aquí está TODO lo que ve un cliente: textos, servicios, precios,
#  enlaces, horarios y colores. No hace falta tocar Python.
#
#  Después de editarlo hay que REINICIAR el servicio: se lee una sola
#  vez, al arrancar.
#
#  ── Dos avisos que ahorran disgustos ────────────────────────────────
#
#  1) EN WHATSAPP, *texto* ES NEGRITA, NO UNA VIÑETA.
#     Si empiezas varias líneas con "* ", WhatsApp empareja unos
#     asteriscos con otros y deja en negrita todo lo que quede en medio.
#     Por eso las viñetas de los precios son "•". Usa los asteriscos
#     solo cuando quieras resaltar de verdad.
#
#  2) LOS HUECOS ENTRE LLAVES NO SE TOCAN.
#     Hay dos que se rellenan al arrancar:
#         {negocio}   el nombre de aquí abajo
#         {duracion}  cuánto dura una cita, en palabras ("1 hora")
#     Y otros que rellena el bot en cada conversación:
#         {name} {date} {time} {url} {detail} {origen} {servicio} {n}
#     Si borras uno, ese dato desaparece del mensaje.
#
#  Para arrancar un cliente nuevo sin editar esto a mano:
#      /superadmin  (la ficha del negocio y su editor de contenido)
# ═════════════════════════════════════════════════════════════════════

[negocio]
nombre = "Nitro 2Tech"
# El correo sale en la política de privacidad (/privacidad), que Meta
# exige para poder pasar la App a modo "En vivo".
email = "nitro.2technology@gmail.com"
web = "https://nitro2tech.com/"

# El número VISIBLE del negocio, formato internacional sin "+".
# OJO: no es PHONE_NUMBER_ID, que es el identificador interno de Meta y
# va en las variables de entorno.
whatsapp = "573161775681"

# Texto del botón de WhatsApp para la web (python scripts/web_button.py)
boton_web = "Chatea con nosotros"

# ── La app instalable en el celular (PWA) ────────────────────────────
# El icono sale del logo que dejes en app/marca/logo.png; si no hay
# ninguno, se dibuja con las iniciales sobre el color de marca.
[marca]
# Quién montó el bot. Sale discreto al pie del panel de atención y en la
# pantalla de entrada. Es lo único que NO cambia de un cliente a otro: el
# panel lleva la marca del negocio y esto es la firma de quien lo hizo.
# Déjalo vacío ("") para quitarlo.
creado_por = "Nitro 2Tech"
# Lo que se lee al instalar la app y en su pantalla de arranque.
app_nombre = "{negocio} · Conversaciones"
# Lo que va DEBAJO del icono. iOS y Android cortan a ~12 caracteres.
app_nombre_corto = "{negocio}"
# Color de marca: barra de estado del celular y fondo del icono.
color = "#16a34a"
# Fondo de la pantalla de arranque, antes de que cargue el panel.
color_fondo = "#f6f7f9"

# ── Enlaces que manda el bot ─────────────────────────────────────────
# Todos juntos a propósito: cuando cambie la web no hay que buscarlos
# repartidos por el archivo. El menú de abajo los pide por su NOMBRE
# (enlace = "precios"), así que cambiando aquí se cambian en todas las
# opciones que lo usen.
#
# Si uno queda vacío, el bot manda la web principal en su lugar: nunca
# le llega un enlace roto a un cliente.
[enlaces]
precios = "https://nitro2tech.com/servicios"
powerbi_demo = "https://nitro2tech.com/servicios"
web_demo = "https://nitro2tech.com/servicios"
automatizacion_demo = "https://nitro2tech.com/servicios"

# ── Horario de atención (para agendar citas) ─────────────────────────
[horario]
# Sin zona horaria, Google crea los eventos en UTC y las citas aparecen
# corridas varias horas.
zona = "America/Bogota"
inicio = "09:00"
fin = "18:00"
# Días laborables: 0=lunes, 1=martes … 5=sábado, 6=domingo
dias = [0, 1, 2, 3, 4]

# Cuánto dura cada cita. Define también cada cuánto empieza un horario
# libre (9:00, 10:00, 11:00… si son 60 minutos).
#
# Una hora y no media: las reuniones se alargan y con media hora el
# siguiente cliente se queda esperando. Además cuadra con el tope de
# WhatsApp — de 09:00 a 18:00 salen 9 huecos y una lista admite 10, así
# que el cliente ve el día entero. Con 30 minutos eran 18 y se quedaban
# 8 sin mostrar.
duracion_cita_min = 60

# Anticipación mínima. Evita ofrecer una cita que empieza en 5 minutos,
# a la que nadie llega.
anticipacion_min = 60

# Cuántos días hacia adelante se buscan huecos libres.
dias_a_buscar = 21

# Cuántos horarios se le ofrecen al cliente. 10 es el TECHO DE WHATSAPP,
# no una decisión nuestra: una lista no admite más filas.
horarios_ofrecidos = 10

titulo_evento = "Cita: {name}"
# Los nombres van escritos aquí y no los pone el sistema: en Windows y
# en los contenedores del hosting el idioma no es el mismo.
dias_semana = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"]
meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"]

# ── Cuándo habla el bot y cuándo se calla ────────────────────────────
[conversacion]
# Si un cliente deja algo a medias y vuelve días después, el bot empieza
# de nuevo en vez de seguir esperando la respuesta que pidió entonces.
# Sin esto queda atrapado: los botones de aquel mensaje ya no están a la
# vista, así que escriba lo que escriba solo recibe "no entendí".
caduca_horas = 24

# Minutos que una conversación tomada a mano puede quedarse quieta antes
# de que el bot la retome solo.
#
# Se cuenta desde lo ÚLTIMO que pasó, venga de quien venga: el bot solo
# vuelve cuando los DOS lados llevan callados ese rato. Medirlo solo por
# el asesor tenía un agujero caro — si tardaba y el cliente contestaba
# después, el bot se despertaba en medio y saludaba desde cero.
takeover_minutos = 180

# Tras agendar, casi siempre lo que sigue es una duda concreta sobre la
# cita que el bot no sabe responder. Mejor pasar directo a un asesor.
takeover_tras_cita = true

# Si el cliente elige "otra consulta", ¿se calla el bot?
takeover_en_otra_consulta = true

# Frases con las que un cliente pide hablar con una persona. Se comparan
# sin tildes y en minúsculas, así que escríbelas así.
palabras_asesor = ["hablar con una persona", "hablar con alguien", "hablar con un humano", "hablar con un asesor", "atencion humana", "asesor humano", "quiero un asesor", "operador"]

# ═════════════════════════════════════════════════════════════════════
#  LA IA — SOLO PLAN PRO
#
#  Esto solo se usa si el servicio tiene IA_ACTIVA=true y su clave de
#  Gemini puesta. En el plan Básico se ignora entero: puedes dejarlo
#  escrito y no pasa nada.
#
#  Qué cambia con la IA encendida: cuando el cliente ESCRIBE en vez de
#  tocar el menú, hoy recibe "no entendí". Con IA, se entiende lo que
#  pidió y se le lleva a la opción que corresponde.
#
#  Lo que la IA NO hace, y no es negociable:
#    - No escribe precios. Esos salen de [precios], aquí abajo.
#    - No agenda. La cita la crea el bot contra Google Calendar, con
#      disponibilidad real.
#    - Si se cae o se agota la cuota, el bot vuelve al menú de siempre.
#      Nunca deja a un cliente sin respuesta.
# ═════════════════════════════════════════════════════════════════════
[ia]
# Quién dice ser. "{negocio}" se rellena solo con el nombre de arriba.
rol = "el asistente comercial de {negocio}"

# Cómo habla. Esto es lo que le da carácter al bot de cada cliente: una
# clínica y una discoteca no escriben igual.
tono = "cercano y claro, tuteando, sin tecnicismos y sin exagerar"

# ── Lo más importante de esta sección ────────────────────────────────
# Lo que tiene PROHIBIDO. Aquí es donde se le cierra la puerta a inventar
# lo que le costaría dinero o credibilidad al negocio. Añade lo tuyo: si
# hay algo que no quieres oír nunca de tu bot, escríbelo aquí.
nunca = [
  "inventar precios, descuentos o promociones que no estén escritos",
  "prometer plazos de entrega o fechas concretas",
  "asegurar que algo está disponible sin haberlo comprobado",
  "hablar mal de la competencia",
  "pedir datos de tarjeta, contraseñas ni documentos de identidad",
]

# Temas en los que la IA no opina: se los pasa a una persona. Un reclamo
# mal contestado por un bot cuesta más que un reclamo sin contestar.
siempre_derivar = ["quejas", "reclamos", "devoluciones", "problemas con un pago"]

# Tope de palabras de una respuesta. Es WhatsApp: un párrafo largo no se
# lee. Se le pide al modelo y además se recorta al recibirlo.
max_palabras = 60

# ═════════════════════════════════════════════════════════════════════
