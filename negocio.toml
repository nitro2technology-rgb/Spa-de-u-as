# ═════════════════════════════════════════════════════════════════════
#  DE DÓNDE LLEGÓ EL CLIENTE
#  Cada canal tiene su mensaje precargado. El "marcador" es la frase
#  distintiva de ese mensaje: cuando el primer mensaje del cliente la
#  contiene, el bot sabe de dónde vino y lo anota, así el Sheet puede
#  mostrar cuántos leads salen de la web, de Instagram o del QR.
#
#  ⚠️ LOS MARCADORES SE COMPARAN SIN TILDES Y EN MINÚSCULAS. Escríbelos
#  así aquí ("vengo de la pagina web", no "vengo de la página web") o no
#  reconocerá el origen.
#
#  El cliente PUEDE borrar el mensaje antes de enviarlo: en ese caso el
#  origen queda como "directo".
#
#  Para un canal nuevo: otra entrada aquí y su botón con
#      python scripts/web_button.py --origen <clave>
# ═════════════════════════════════════════════════════════════════════
[origenes.web]
mensaje = "Hola {negocio}, vengo de la página web y quisiera más información."
marcador = "vengo de la pagina web"

[origenes.instagram]
mensaje = "Hola {negocio}, los vi en Instagram y quisiera más información."
marcador = "los vi en instagram"

[origenes.qr]
mensaje = "Hola {negocio}, escaneé su código QR y quisiera más información."
marcador = "escanee su codigo qr"

[origenes_ajustes]
por_defecto = "directo"
boton_web = "web"

# ═════════════════════════════════════════════════════════════════════
#  PESTAÑAS DEL GOOGLE SHEET
#  UNA POR SERVICIO, más una de citas. Así cada servicio se analiza por
#  separado: cuántos preguntaron, cuántos vieron precios, cuántos
#  agendaron. Quien nunca elige servicio cae en "otros".
#
#  "formato" decide qué columnas lleva la fila:
#      "servicio" → el recorrido y el mensaje del cliente
#      "cita"     → además el servicio, el día y la hora
#
#  ⚠️ LAS CITAS SE ESCRIBEN DOS VECES a propósito: en "citas", para
#  verlas todas juntas, y en la pestaña de su servicio, para ver ahí el
#  movimiento completo. Es el mismo cliente en dos filas — tenlo en
#  cuenta si cuentas clientes sumando pestañas.
#
#  El bot crea las pestañas que falten al arrancar. Si añades una columna
#  aquí, agrégala TAMBIÉN a mano al final de la fila de encabezados del
#  Sheet: el bot no reordena columnas de una pestaña que ya existe, para
#  no pisar datos que ya tengas.
# ═════════════════════════════════════════════════════════════════════
[sheets]
# Nombres que Google le pone a la pestaña de un Sheet nuevo. Si está
# vacía, se reaprovecha renombrándola en vez de dejarla ahí sin usar.
pestanas_por_defecto =["Hoja 1", "Hoja1", "Sheet1", "Sheet 1"]

[sheets.pestanas.chatbot]
nombre = "Chatbots para WhatsApp"
formato = "servicio"
columnas = ["Fecha de contacto", "Nombre", "Teléfono", "Recorrido", "Mensaje", "Origen", "Estado"]

[sheets.pestanas.powerbi]
nombre = "Tableros Power BI"
formato = "servicio"
columnas = ["Fecha de contacto", "Nombre", "Teléfono", "Recorrido", "Mensaje", "Origen", "Estado"]

[sheets.pestanas.web]
nombre = "Páginas web"
formato = "servicio"
columnas = ["Fecha de contacto", "Nombre", "Teléfono", "Recorrido", "Mensaje", "Origen", "Estado"]

[sheets.pestanas.automatizacion]
nombre = "Automatizaciones"
formato = "servicio"
columnas = ["Fecha de contacto", "Nombre", "Teléfono", "Recorrido", "Mensaje", "Origen", "Estado"]

[sheets.pestanas.otros]
nombre = "Otras consultas"
formato = "servicio"
columnas = ["Fecha de contacto", "Nombre", "Teléfono", "Recorrido", "Mensaje", "Origen", "Estado"]

[sheets.pestanas.citas]
nombre = "Citas agendadas"
formato = "cita"
columnas = ["Fecha de contacto", "Nombre", "Teléfono", "Servicio", "Recorrido", "Día de la cita", "Hora", "Origen", "Estado", "ID del evento"]

# ═════════════════════════════════════════════════════════════════════
#  EL MENÚ: LOS SERVICIOS QUE VE EL CLIENTE
#
#  ── LÍMITES DE WHATSAPP. Si te pasas, corta a media palabra SIN AVISAR
#     title        24 caracteres   ← el renglón grande
#     description  72 caracteres   ← el renglón gris de abajo
#     title de un BOTÓN  20        ← ojo, menos que en la lista
#
#     El truco para que quepa: título corto y la frase completa en la
#     descripción. El cliente ve las dos cosas.
#
#  ── CÓMO SE MANDA. Lo elige el bot solo, no se configura:
#     hasta 3 opciones → BOTONES, que se ven directo en el chat
#     de 4 en adelante → LISTA, que obliga a un toque más para abrirla
#
#     Por eso los submenús de 3 llevan textos más cortos: son botones y
#     el tope baja a 20. Las pruebas fallan si algún texto se pasa.
#
#  ── QUÉ HACE CADA "accion"
#     submenu    abre otro grupo de opciones (las de su [[menu.submenu]])
#     info       manda un texto y vuelve a ofrecer opciones (las de "luego")
#     enlace     responde con un enlace y deja el menú abierto
#     cita       arranca el agendamiento con Google Calendar
#     humano     pasa la conversación a un asesor y calla al bot
#     reagendar  libera la cita actual y ofrece otro horario
#     cancelar   cancela la cita
#     menu       vuelve al menú principal
#     terminar   se despide y el bot se calla
#
#  ── LAS DEMÁS CLAVES
#     sheet          a qué pestaña del Sheet escribe este servicio
#     servicio       cómo se llama en el aviso al dueño y en el Sheet
#     paso           qué se anota en la columna "Recorrido"
#     luego          qué opciones se ofrecen después, POR ID: así son
#                    literalmente los mismos botones y no hay dos sitios
#                    donde acordarse de cambiar el texto
#     oculta         no aparece en el menú, solo desde el "luego" de otra
#     solo_con_cita  solo se ofrece si el cliente tiene una cita futura
#     enlace         nombre de un enlace de [enlaces], no la URL entera
#     precios        nombre de un texto de [precios]
#
#  Si "enlace" o "precios" nombran algo que no existe, el bot NO arranca
#  y dice cuál falla. Es a propósito: mejor eso que un mensaje en blanco
#  delante de un cliente.
# ═════════════════════════════════════════════════════════════════════

